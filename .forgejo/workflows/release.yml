# What this guards: custom_components/sun_cycle_bg/www/ holds copies of the
# card (src/) and its pictures (demo/assets/), and nothing but discipline keeps
# a copy in step with its original. HACS installs custom_components/sun_cycle_bg/,
# so a stale copy means a fresh install silently gets the *previous* card under
# the new version number. Until 1.29 the same held for dist/ of the plugin.
#
# So: rebuild www/ here and fail if that changes anything; check that the
# integration's Python compiles and its manifest has what HACS reads; and on a
# tag check that the card, the manifest and the tag name one version.
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  release:
    runs-on: shell
    steps:
      # Not actions/checkout@v4. Using an action means the runner first fetches
      # it from github.com, and from this runner that fetch fails about as often
      # as it works ("could not read Username for 'https://github.com'"), which
      # turns a green pipeline into a coin toss for reasons that have nothing to
      # do with the card. The repository is a few commands away on the Forgejo
      # instance that started the job, with the token the job already carries.
      - name: check out this commit from Forgejo
        run: |
          git init -q .
          git remote | grep -qx origin ||
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraHeader="Authorization: basic $(printf '%s' \
                'x-access-token:${{ secrets.GITHUB_TOKEN }}' | base64 -w0)" \
              fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -qf FETCH_HEAD
          git clean -qxdff          # last run's leftovers are not this commit
          # --no-pager everywhere: this runner gives the job a tty, so a bare
          # `git log` sits in less until the job is cancelled
          git --no-pager log -1 --oneline

      - name: www/ is what tools/make_dist.py produces
        run: |
          python3 tools/make_dist.py
          if ! git diff --quiet -- custom_components/ || [ -n "$(git status --porcelain -- custom_components/)" ]; then
            echo "::error::custom_components/sun_cycle_bg/www/ is stale: run 'python3 tools/make_dist.py' and commit it"
            git --no-pager status --short -- custom_components/
            exit 1
          fi
          echo "www/ matches the sources"

      - name: the card in www/ is the card in src/
        run: cmp custom_components/sun_cycle_bg/www/sun-cycle-bg.js src/sun-cycle-bg.js

      - name: the integration compiles and its manifest has what HACS reads
        run: |
          python3 -m py_compile custom_components/sun_cycle_bg/*.py
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("custom_components")
          dirs = [d for d in root.iterdir() if d.is_dir()]
          if [d.name for d in dirs] != ["sun_cycle_bg"]:
              sys.exit(f"HACS manages one integration per repository, found {[d.name for d in dirs]}")
          m = json.loads((root / "sun_cycle_bg" / "manifest.json").read_text())
          need = ["domain", "name", "version", "documentation", "issue_tracker", "codeowners"]
          missing = [k for k in need if not m.get(k)]
          if missing:
              sys.exit(f"manifest.json lacks {missing}")
          rest = [k for k in m if k not in ("domain", "name")]
          if list(m)[:2] != ["domain", "name"] or rest != sorted(rest):
              sys.exit("manifest.json keys: domain, name, then the rest sorted (hassfest)")
          for f in ("brand/icon.png", "brand/icon@2x.png", "www/loader.js", "www/panel.js"):
              if not (root / "sun_cycle_bg" / f).is_file():
                  sys.exit(f"missing custom_components/sun_cycle_bg/{f}")
          print(f"manifest {m['domain']} {m['version']}: ok")
          PY

      - name: the tag is the version the card and the manifest announce
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          KARTA=$(sed -n '1s/.*sun-cycle-bg \([0-9][0-9.]*\).*/\1/p' src/sun-cycle-bg.js)
          MANIFEST=$(python3 -c 'import json;print(json.load(open("custom_components/sun_cycle_bg/manifest.json"))["version"])')
          TAG=${GITHUB_REF#refs/tags/v}
          echo "card: $KARTA, manifest: $MANIFEST, tag: $TAG"
          [ "$KARTA" = "$TAG" ] && [ "$MANIFEST" = "$TAG" ] || {
            echo "::error::card says $KARTA, manifest $MANIFEST, tag $TAG"; exit 1; }

      # The smoke suite needs a browser (test/smoke.html + tools/run_smoke.py).
      # The runner has neither chromium nor playwright — checked on LXC 131,
      # not assumed — so it stays a local step: `python3 tools/run_smoke.py`,
      # expect ERRORS: [].
