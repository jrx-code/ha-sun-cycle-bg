<div id="host"></div>
<script>
// minimal stand-ins for the HA view chrome the card climbs to
class HuiViewContainer extends HTMLElement {}
class HuiViewBackground extends HTMLElement {}
class HuiView extends HTMLElement {}
customElements.define('hui-view-container', HuiViewContainer);
customElements.define('hui-view-background', HuiViewBackground);
customElements.define('hui-view', HuiView);
const FROZEN = new Date(Date.UTC(2026, 7, 28, 23, 43, 0));   // reference instant: moon high, deep night
const RealDate = Date;
Date = class extends RealDate {
  constructor(...a) { return a.length ? new RealDate(...a) : new RealDate(FROZEN); }
  static now() { return FROZEN.getTime(); }
};
</script>
<script src="../src/sun-cycle-bg.js"></script>
<script>
const out = [];
function buduj(elev, azim, extra) {
  document.getElementById('host').innerHTML = '';
  const cont = document.createElement('hui-view-container');
  // Give it the kiosk view's size: the sun blur is a share of the disc, which
  // is a share of the container width, so a zero-width stand-in would silently
  // test the "no blur" branch only.
  cont.style.cssText = 'display:block;position:relative;width:1920px;height:1030px';
  cont.appendChild(document.createElement('hui-view-background'));
  cont.appendChild(document.createElement('hui-view'));
  document.getElementById('host').appendChild(cont);
  const card = document.createElement('sun-cycle-bg-card');
  // `assets:` przesuwa wszystkie domyslne sciezki naraz — tu na repo, bo
  // domyslnie karta bierze obrazki z /hacsfiles/, ktorego pod file:// nie ma
  card.setConfig(Object.assign({ assets: '../demo/assets/', stars: { count: 40 } },
                               extra || {}));
  cont.insertBefore(card, cont.firstChild);
  card.hass = {
    states: { 'sun.sun': { attributes: { elevation: elev, azimuth: azim } } },
    config: { latitude: 52.2297, longitude: 21.0122 }
  };
  return cont;
}
// Reading is split from building: the moon artwork only reaches the DOM after
// its file decodes, so the picture-mode checks build, wait, then read.
function czytaj(cont, elev, azim) {
  const bg = cont.querySelector('hui-view-background');
  const ray = cont.querySelector('.sun-cycle-ray');
  const moon = cont.querySelector('.sun-cycle-moon');
  const lit = moon && moon.querySelector('.scb-lit');
  const stars = cont.querySelector('.sun-cycle-stars');
  const sunDisc = cont.querySelector('.sun-cycle-sun');
  const spin = moon && moon.querySelector('.scb-spin');
  const mimg = moon && moon.querySelector('image');
  const bgs = bg.style.background || '';
  const band = /radial-gradient\((\d+)% (\d+)% at ([\d.]+)% 100%/.exec(bgs);
  const m = /at ([\d.]+)% ([\d.]+)%\)?,?\s*rgba/.exec(bgs) || /at ([\d.]+)% ([\d.]+)%/g.exec(bgs);
  return {
    elev, azim,
    sunX: m ? +m[1] : null, sunY: m ? +m[2] : null,
    bandW: band ? +band[1] : null, bandH: band ? +band[2] : null, bandX: band ? +band[3] : null,
    rayOpacity: ray ? +ray.style.opacity : null,
    rayBlur: ray ? ray.style.filter : null,
    moonLeft: moon ? moon.style.left : null,
    moonTop: moon ? moon.style.top : null,
    moonAlpha: moon ? +moon.style.opacity : null,
    litPath: lit ? lit.getAttribute('d') : null,
    litRot: lit ? lit.getAttribute('transform') : null,
    starDots: stars ? stars.querySelectorAll('.scs').length : 0,
    bgHasGradient: /linear-gradient/.test(bg.style.background || ''),
    // artwork path (1.3.0); null on the drawn card
    sunDiscW: sunDisc ? sunDisc.style.width : null,
    sunDiscPos: sunDisc ? sunDisc.style.left + '/' + sunDisc.style.top : null,
    sunDiscShift: sunDisc ? sunDisc.style.transform : null,
    sunDiscAlpha: sunDisc ? +sunDisc.style.opacity : null,
    sunDiscFilter: sunDisc ? sunDisc.style.filter : null,
    moonMode: moon && moon.firstElementChild ? moon.firstElementChild.dataset.mode : null,
    moonSpin: spin ? spin.getAttribute('transform') : null,
    moonImgBox: mimg ? ['x','y','width','height'].map(a => mimg.getAttribute(a)).join(' ') : null,
    moonFilter: moon ? (moon.style.filter || null) : null,
  };
}
const scene = (elev, azim, extra) => czytaj(buduj(elev, azim, extra), elev, azim);
out.push(['WSCHOD  elev=+1 az=70 ', scene(1, 70)]);
out.push(['POLUDNIE elev=+49 az=180', scene(49, 180)]);
out.push(['ZACHOD  elev=+1 az=290', scene(1, 290)]);
out.push(['NOC     elev=-16 az=322', scene(-16.18, 321.56)]);

// 1.3.0: the same instants with artwork configured. The moon needs its file
// decoded before the SVG can be built, so the picture-mode checks wait for it.
const OBRAZKI = {
  sun_image: '../demo/assets/sun.png',
  sun_image_width: 10.5,
  sun_image_blur: 11.5,
  sun_image_disc: [0.78878, 0.50816, 0.48469],
  moon_image: '../demo/assets/moon.png',
  moon_image_width: 13,
  moon_image_disc: [0.42870, 0.5, 0.5],
};
out.push(['OBRAZKI dzien  elev=+49', scene(49, 180, OBRAZKI)]);

// 1.4.0: the star layer carries sizes, flares, meteors and the ISS. Read the
// layer itself here — the scene reader above only counts the dots.
function gwiazdy(cont) {
  const layer = cont.querySelector('.sun-cycle-stars');
  if (!layer) return { layer: false };
  const css = layer.querySelector('style').textContent;
  const iss = layer.querySelector('.scs-iss');
  return {
    layer: true,
    inst: layer.className.replace('sun-cycle-stars ', ''),
    // stars are the farthest thing: right above the painted backdrop
    afterBackdrop: layer.previousElementSibling &&
      layer.previousElementSibling.tagName === 'HUI-VIEW-BACKGROUND',
    opacity: +layer.style.opacity,
    dots: layer.querySelectorAll('.scs').length,
    dotSizes: [...new Set([...layer.querySelectorAll('.scs')].map(d => d.style.width))].sort(),
    flares: layer.querySelectorAll('.scs-flare').length,
    flareKeyframes: (css.match(/@keyframes [\w-]+-fl\d+/g) || []).length,
    twinkleLow: (css.match(/-tw0\{0%,100%\{opacity:([\d.]+)\}/) || [])[1],
    drift: /-drift\{from/.test(css),
    spin: !!layer.querySelector('.scs-spin'),
    meteors: layer.querySelectorAll('.scs-meteor').length,
    iss: !!iss,
    issLabel: iss ? (iss.querySelector('span') || {}).textContent : null,
    issTrail: iss ? (iss.querySelector('i') || {}).style && iss.querySelector('i').style.width : null,
  };
}
// FROZEN is 23:43 UTC — a pass that started a minute ago and runs five more
// exercises "join in flight"; the ones after it are the queue.
const T = Math.floor(FROZEN.getTime() / 1000);
const przelot = (start, end, od, do_, alt) => ({ attributes: {
  pass_start_unix: start, pass_end_unix: end, max_elevation: alt,
  start_compass: od, end_compass: do_ } });
const ISS_STATES = {
  'sensor.iss_visual_pass_0': przelot(T - 60, T + 300, 'SW', 'E', 41),
  'sensor.iss_visual_pass_1': przelot(T + 5400, T + 5800, 'W', 'NE', 22),
};
const PELNE = {
  stars: {
    count: 160, sizes: 'mixed', size: 0.5, glow: 0.05, twinkle: 0.45, drift: 0,
    flares: { count: 5, every: 18, strength: 1, spikes: false },
    meteors: { rate: 28, length: 110, speed: 1.1, radiant: [78, 12], pair: 0.35 },
    iss: { entities: 'sensor.iss_visual_pass_', count: 5, trail: 60, label: true },
  },
};
{
  const cont = buduj(-16.18, 321.56, PELNE);
  const card = cont.querySelector('sun-cycle-bg-card');
  card.hass = {
    states: Object.assign({ 'sun.sun': { attributes: { elevation: -16.18, azimuth: 321.56 } } }, ISS_STATES),
    config: { latitude: 53.5, longitude: 14.5 },
  };
  const layer = cont.querySelector('.sun-cycle-stars');
  layer.scsMeteor();                              // on demand, like a tuning page
  out.push(['GWIAZDY pelne  noc', gwiazdy(cont)]);
  layer.scsStop();
}
out.push(['GWIAZDY domyslne  noc', gwiazdy(buduj(-16.18, 321.56, { stars: {} }))]);
out.push(['GWIAZDY domyslne  dzien', gwiazdy(buduj(49, 180, { stars: {} }))]);
out.push(['GWIAZDY rotate', gwiazdy(buduj(-16.18, 321.56, { stars: { rotate: true, count: 60 } }))]);
out.push(['GWIAZDY wylaczone', gwiazdy(buduj(-16.18, 321.56, { stars: false }))]);
out.push(['GWIAZDY readStarConfig({})', window.sunCycleBg.readStarConfig({})]);
// 1.5.0: planets. The card ships no artwork, and a missing file would log a
// console error the runner counts, so every body points at a 1x1 transparent
// PNG — the geometry under test is the placement, not the picture.
// biale, kryjace 8x8 — scena Drogi Mlecznej sprawdza, czy warp cokolwiek
// namalowal, wiec przezroczysty piksel by tego nie pokazal
const BIALY = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAFklEQVR4nGP8////fwY8gAmf5PBRAAAbbgQMid1tCwAAAABJRU5ErkJggg==';
const PIKSEL = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
const SOL = (() => {
  // one planet high in the south, one low in the east, one below the horizon,
  // one outside the 50-310 azimuth window
  const p = { saturn: [119, 23], uranus: [67, 9], venus: [289, -27.5], jupiter: [4, -19] };
  const st = {};
  for (const b of window.sunCycleBg.PLANET_BODIES) {
    const v = p[b] || [180, 30];
    st['sensor.sol_' + b + '_azimuth'] = { state: String(v[0]) };
    st['sensor.sol_' + b + '_elevation'] = { state: String(v[1]) };
  }
  return st;
})();
function planety(cont) {
  const layer = cont.querySelector('.sun-cycle-planets');
  if (!layer) return { layer: false };
  const czytaj1 = (b) => {
    const el = layer.querySelector('[data-body=' + b + ']');
    if (!el) return null;
    const im = el.querySelector('img'), pk = el.querySelector('i');
    return { w: el.style.width, przesun: el.style.transform,
             czas: el.style.transitionDuration, alpha: +el.style.opacity,
             glow: /drop-shadow/.test(el.style.filter),
             // '' means the card never wrote it — not zero
             tarcza: im && im.style.opacity !== '' ? +im.style.opacity : null,
             punkt: pk ? +pk.style.opacity : null,
             punktD: pk ? pk.style.width : null,
             label: (el.querySelector('b') || {}).textContent || null };
  };
  return {
    layer: true,
    // above the stars (painted earlier in the tree), below the moon
    przedKsiezycem: !!(layer.nextElementSibling &&
      layer.nextElementSibling.classList.contains('sun-cycle-moon')),
    poGwiazdach: [...layer.parentNode.children].indexOf(layer) >
      [...layer.parentNode.children].findIndex(e => e.classList.contains('sun-cycle-stars')),
    scoped: /sun-cycle-planets>div/.test(layer.querySelector('style').textContent),
    ile: layer.querySelectorAll('[data-body]').length,
    wysoko: czytaj1('saturn'), nisko: czytaj1('uranus'),
    podHoryzontem: czytaj1('venus'), pozaOknem: czytaj1('jupiter'),
  };
}
/* 1.7.0: the walk. Sol carries next_target/next_update; the card should aim
   the disc at the promised spot and give the transition exactly the time that
   is left. These states are built with a promise 120 s out. */
function solZObietnica(offsetS) {
  const st = {};
  const teraz = FROZEN.getTime();
  for (const b of window.sunCycleBg.PLANET_BODIES) {
    const v = SOL['sensor.sol_' + b + '_azimuth'].state;
    const e = SOL['sensor.sol_' + b + '_elevation'].state;
    st['sensor.sol_' + b + '_azimuth'] = {
      state: v, last_changed: new Date(teraz - 60000).toISOString(),
      attributes: { next_target: String(+v + 1),
                    next_update: new Date(teraz + offsetS * 1000).toISOString() } };
    st['sensor.sol_' + b + '_elevation'] = {
      state: e, last_changed: new Date(teraz - 30000).toISOString(),
      // the other axis is due later, so the pair must ride the azimuth deadline
      attributes: { next_target: String(+e + 0.5),
                    next_update: new Date(teraz + offsetS * 2000).toISOString() } };
  }
  return st;
}
function scenaChod(offsetS, przezZero) {
  const st = solZObietnica(offsetS);
  if (przezZero) {                       // 359.0 -> 0.0 is one degree, not 359
    st['sensor.sol_saturn_azimuth'].state = '359.0';
    st['sensor.sol_saturn_azimuth'].attributes.next_target = '0.0';
  }
  const cont = buduj(-16.18, 321.56, { stars: { count: 20 }, planets: {
    files: Object.fromEntries(window.sunCycleBg.PLANET_BODIES.map(b => [b, PIKSEL])) } });
  cont.querySelector('sun-cycle-bg-card').hass = {
    states: Object.assign({ 'sun.sun': { attributes: { elevation: -16.18, azimuth: 321.56 } } }, st),
    config: { latitude: 53.5, longitude: 14.5 },
  };
  return planety(cont);
}

function scenaPlanet(elev, extra) {
  const cfg = Object.assign({ files: Object.fromEntries(
    window.sunCycleBg.PLANET_BODIES.map(b => [b, PIKSEL])) }, extra || {});
  const cont = buduj(elev, 321.56, { stars: { count: 20 }, planets: cfg });
  cont.querySelector('sun-cycle-bg-card').hass = {
    states: Object.assign({ 'sun.sun': { attributes: { elevation: elev, azimuth: 321.56 } } }, SOL),
    config: { latitude: 53.5, longitude: 14.5 },
  };
  return planety(cont);
}
out.push(['PLANETY noc domyslne', scenaPlanet(-16.18)]);
out.push(['PLANETY noc z podpisami', scenaPlanet(-16.18, { labels: true, size: 4 })]);
out.push(['PLANETY dzien (gasna)', scenaPlanet(49)]);
out.push(['PLANETY dzien day:true (podloga 0.35)', scenaPlanet(49, { day: true })]);
out.push(['PLANETY dzien day:0.15', scenaPlanet(49, { day: 0.15 })]);
out.push(['PLANETY zmierzch day:true elev=-4', scenaPlanet(-4, { day: true })]);
out.push(['PLANETY szereg diameters', scenaPlanet(-16.18, { scale: 'diameters', size: 1.2 })]);
// 1.9.0: planety gasna razem z niebem, nie na prog
out.push(['PLANETY noc -16 (niebo 1.0)', scenaPlanet(-16.18)]);
out.push(['PLANETY zmierzch -9 (niebo 0.65)', scenaPlanet(-9)]);
out.push(['PLANETY zmierzch -4 (niebo 0.2)', scenaPlanet(-4)]);
out.push(['PLANETY slonce 0 (niebo 0)', scenaPlanet(0)]);
out.push(['PLANETY slonce +20 (niebo 0)', scenaPlanet(20)]);
out.push(['PLANETY punkt: dzien +20', scenaPlanet(20, { day: 0.35 })]);
out.push(['PLANETY punkt: swit +2', scenaPlanet(2, { day: 0.35 })]);
out.push(['PLANETY punkt wylaczony', scenaPlanet(20, { day: 0.35, points: false })]);
out.push(['PLANETY chod 120 s', scenaChod(120)]);
out.push(['PLANETY chod bez obietnicy', scenaPlanet(-16.18)]);
out.push(['PLANETY chod przez polnoc', scenaChod(120, true)]);
out.push(['PLANETY wylaczone', planety(buduj(-16.18, 321.56, { planets: false }))]);
out.push(['PLANETY readPlanetConfig(true)', window.sunCycleBg.readPlanetConfig(true)]);

// 1.9.0: Droga Mleczna — jeden kanwowy kadr pod gwiazdami. Zdjecie podstawiam
// jednopikselowe, bo tu chodzi o geometrie i wpiecie warstwy, nie o obrazek.
function mleczna(elev, extra) {
  const cont = buduj(elev, 321.56, { stars: { count: 20 }, moon: false,
    milky_way: Object.assign({ image: BIALY, l: -5, b: -2, rot: -24, fov: 110 }, extra || {}) });
  const mw = cont.querySelector('.sun-cycle-milky');
  if (!mw) return { warstwa: false };
  return {
    warstwa: true,
    poBackdropie: !!(mw.previousElementSibling &&
      mw.previousElementSibling.tagName === 'HUI-VIEW-BACKGROUND'),
    przedGwiazdami: !!(mw.nextElementSibling &&
      mw.nextElementSibling.classList.contains('sun-cycle-stars')),
    krycie: mw.style.opacity,
    kanwa: mw.width + 'x' + mw.height,
  };
}
out.push(['MLECZNA noc -16', mleczna(-16.18)]);
out.push(['MLECZNA zmierzch -4', mleczna(-4)]);
out.push(['MLECZNA dzien +20', mleczna(20)]);
out.push(['MLECZNA bez obrazka', mleczna(-16.18, { image: '' })]);
out.push(['MLECZNA panorama (equirect)', mleczna(-16.18, { projection: 'equirect' })]);
out.push(['MLECZNA readMilkyConfig', window.sunCycleBg.readMilkyConfig(
  { image: '/local/x.webp', l: -5, b: -2, rot: -24, fov: 110 })]);
// 1.11.0: `milky_way: {}` musi samo trafic na plik z dist/ i na zmierzone
// polozenie tego pliku. Wczesniej wychodzil z tego adres "undefined".
out.push(['MLECZNA domyslny kadr', window.sunCycleBg.readMilkyConfig({})]);
out.push(['MLECZNA domyslna panorama', window.sunCycleBg.readMilkyConfig(
  { projection: 'equirect' })]);
out.push(['MLECZNA domyslny kadr + assets:', window.sunCycleBg.readMilkyConfig(
  {}, '/local/sun-cycle/')]);
// wlasny plik nie dostaje cudzych pomiarow
out.push(['MLECZNA wlasny plik bez polozenia', window.sunCycleBg.readMilkyConfig(
  { image: '/local/moje.png' })]);
// geometria: centrum Galaktyki i Oblok Magellana wg katalogu
out.push(['MLECZNA galToEq(0,0)', window.sunCycleBg.galToEq(0, 0)]);
out.push(['MLECZNA galToEq(280.5,-32.9) = LMC', window.sunCycleBg.galToEq(280.5, -32.9)]);

const contNoc = buduj(-16.18, 321.56, OBRAZKI);
out.push(['OBRAZKI noc  przed wczytaniem pliku', czytaj(contNoc, -16.18, 321.56)]);
setTimeout(() => {
  out.push(['OBRAZKI noc  po wczytaniu pliku', czytaj(contNoc, -16.18, 321.56)]);
  // Kanwa dostaje rozmiar dopiero, gdy obrazek sie wczyta — a `buduj()`
  // czysci #host, wiec scena Drogi Mlecznej musi byc ostatnia i przez chwile
  // zostac w dokumencie, inaczej rysuje w kontenerze bez wymiarow.
  const contMleczna = buduj(-16.18, 321.56, { stars: { count: 20 }, moon: false,
    milky_way: { image: BIALY, l: -5, b: -2, rot: -24, fov: 110 } });
  setTimeout(() => {
    const mw = contMleczna.querySelector('.sun-cycle-milky');
    out.push(['MLECZNA po wczytaniu pliku', {
      kanwa: mw.width + 'x' + mw.height,
      kadr: mw.clientWidth + 'x' + mw.clientHeight,
      poBackdropie: mw.previousElementSibling.tagName === 'HUI-VIEW-BACKGROUND',
      przedGwiazdami: !!(mw.nextElementSibling &&
        mw.nextElementSibling.classList.contains('sun-cycle-stars')),
      // ile pikseli kanwy dostalo swiatlo — zero znaczy, ze warp nic nie narysowal
      zapisane: (() => {
        const g = mw.getContext('2d');
        const d = g.getImageData(0, 0, mw.width, mw.height).data;
        let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 2) n++;
        return n;
      })(),
    }]);
    document.title = JSON.stringify(out);
    window.__smokeDone = true;
  }, 300);
}, 400);
</script>
